packages:
  - packages/*

# pnpm blocks dependency postinstall scripts by default (supply-chain defence).
# Allow only what genuinely needs to run, and justify additions in the PR.
#   esbuild    — the bundler vitest and wxt use; needs its platform binary.
#   lefthook   — needs to install its git-hook binary.
#   spawn-sync — a legacy polyfill for old Node; unnecessary here, so denied.
allowBuilds:
  esbuild: true
  lefthook: true
  spawn-sync: false
