# git hooks. Install with `pnpm exec lefthook install` (done for you by `make setup`).
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.{rs,ts,tsx,js,json,md,yml,yaml}'
      run: make fmt-check
    lint:
      glob: '*.{rs,ts,tsx}'
      run: make lint
    secrets:
      run: gitleaks protect --staged --redact --no-banner
      # Do not block commits where gitleaks is not installed. CI always runs it.
      skip: true

pre-push:
  commands:
    test:
      run: make test
