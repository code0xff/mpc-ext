[workspace]
resolver = "2"
members = ["crates/mpc-core", "crates/mpc-wasm", "crates/mpc-server"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/dsrvlabs/mpc-ext"

[workspace.dependencies]
mpc-core = { path = "crates/mpc-core" }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
# MIT/Apache-2.0. Server-side WebAuthn RP verification for the passkey ceremony.
webauthn_rp = { version = "0.3.0", features = ["serde_relaxed", "serializable_server_state"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

# Tests run DKG repeatedly, and cryptographic code in a debug build is tens of times slower.
# Optimise dependencies only: the suite stays fast while our own code keeps debug info.
[profile.test.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
