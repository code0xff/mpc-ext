[package]
name = "mpc-core"
description = "2-of-3 threshold ECDSA protocol core, shared by the extension (wasm) and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ADR-0004: exact version pin. Dependabot ignores it, so it never updates automatically;
# upstream changes land manually after review.
dkls23-secp256k1 = "=0.5.1"
# Upstream was built against RustCrypto pre-releases and no longer compiles under default
# resolution now that stable 0.14.1 exists. Pin the same versions upstream's Cargo.lock uses.
# Drop these pins once upstream moves to stable (ADR-0004, mitigation 5).
elliptic-curve = "=0.14.0-rc.29"
k256 = "=0.14.0-rc.8"
rustcrypto-ff = "=0.14.0-rc.0"
bincode = "1"
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
k256 = "=0.14.0-rc.8"
serde_json = "1.0.151"
