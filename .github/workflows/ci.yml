name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  js:
    name: js (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `pnpm install` runs `wxt prepare`, which imports the wasm glue, so build it first.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned: `latest` resolves inconsistently between jobs (one run got 0.15.0 and 0.9.1), and
      # 0.9.1 cannot read `license.workspace` in our manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - run: make build-wasm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s fmt:check
      - run: pnpm -s lint
      - run: pnpm -s typecheck
      - run: pnpm -s test

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned: `latest` resolves inconsistently between jobs (one run got 0.15.0 and 0.9.1), and
      # 0.9.1 cannot read `license.workspace` in our manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - run: wasm-pack build crates/mpc-wasm --target web

  extension:
    name: extension build + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned: `latest` resolves inconsistently between jobs (one run got 0.15.0 and 0.9.1), and
      # 0.9.1 cannot read `license.workspace` in our manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Before install: `wxt prepare` in the postinstall imports the wasm glue.
      - run: make build-wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/extension build
      # The smoke test drives a real server, so it needs the binary.
      - run: make build-server
      # Chrome 137 and later ignore --load-extension in the regular browser.
      - run: pnpm dlx @puppeteer/browsers install chrome@stable
      - run: pnpm -C packages/extension smoke
      # Drives the popup by typing and clicking. The smoke test above sends messages to the worker
      # and never draws a component, so it cannot notice a blank or broken popup.
      - run: pnpm -C packages/extension ui-smoke

  supply-chain:
    name: licenses, advisories, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Block copyleft and vulnerable dependencies (AGENTS.md open-source rules).
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
