version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # The pinned MPC crate must not update automatically (ADR-0004, mitigation 1).
    ignore:
      - dependency-name: dkls23-*
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
